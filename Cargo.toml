[workspace]
resolver = "3"
members = [
  "crates/api",
  "crates/ecs",
  "crates/core",
  "crates/gfx",
  "crates/assets",
  "crates/script",
  "crates/fmt-toon",
  "crates/fmt-json",
  "crates/cli",
  "crates/app",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
api = { path = "crates/api" }
ecs = { path = "crates/ecs" }
core = { path = "crates/core" }
gfx = { path = "crates/gfx" }
assets = { path = "crates/assets" }
script = { path = "crates/script" }
fmt-toon = { path = "crates/fmt-toon" }
fmt-json = { path = "crates/fmt-json" }
cli = { path = "crates/cli" }
mlua = { version = "0.11", features = ["luau", "vendored", "serialize"] }
png = "0.18"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
