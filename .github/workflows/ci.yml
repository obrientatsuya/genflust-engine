# CI: o árbitro. PR só entra com os dois sistemas verdes (AGENTS.md §9, Ambiente).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Lê rust-toolchain.toml (versão fixa + rustfmt + clippy).
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Inclui os golden hashes: a suíte compara contra o MESMO arquivo
      # commitado, então Linux e Windows precisam bater (R7).
      - name: Test
        run: cargo test

      - name: Arch check
        run: cargo xtask arch-check

      - name: Token budget
        run: cargo xtask token-budget

  # Prova o mundo Fedora (dnf/g++ em vez de apt) num container; o Taylor
  # desenvolve no Fedora e nunca deve ficar de fora do "árbitro".
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools (Fedora)
        run: dnf install -y gcc gcc-c++ make curl git tar gzip ca-certificates

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Arch check
        run: cargo xtask arch-check

      - name: Token budget
        run: cargo xtask token-budget

      # Caminho real do usuário: instalar o binário e rodar a CLI num projeto.
      - name: Install engine and smoke-test CLI (Fedora)
        run: |
          cargo install --path crates/app --locked
          export PATH="$HOME/.cargo/bin:$PATH"
          cd examples/hello
          engine check
          engine run --frames 2
          engine screenshot --frames 2 --out out/smoke.png
          test -f out/smoke.png
